name: Build and Upload UniApp to WeChat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build uni-app for MP-Weixin
        run: npm run build:mp-weixin

      - name: Upload to WeChat MiniProgram
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$WECHAT_APP_ID" ]; then
            echo "WECHAT_APP_ID is not set"
            exit 1
          fi

          if [ -z "$WECHAT_PRIVATE_KEY_BASE64" ]; then
            echo "WECHAT_PRIVATE_KEY_BASE64 is not set"
            exit 1
          fi

          if [ ! -d "dist/build/mp-weixin" ]; then
            echo "Build output dist/build/mp-weixin does not exist"
            exit 1
          fi

          trap 'rm -f private.key' EXIT
          printf '%s' "$WECHAT_PRIVATE_KEY_BASE64" | base64 --decode > private.key

          node <<'EOF'
          const ci = require('miniprogram-ci')
          const packageJson = require('./package.json')

          const version = packageJson.version || '1.0.0'
          const shortSha = (process.env.GITHUB_SHA || '').slice(0, 7)
          const desc = `GitHub Actions build ${process.env.GITHUB_RUN_NUMBER || ''} ${shortSha}`.trim()

          const project = new ci.Project({
            appid: process.env.WECHAT_APP_ID,
            type: 'miniProgram',
            projectPath: 'dist/build/mp-weixin',
            privateKeyPath: 'private.key',
            ignores: ['node_modules/**/*']
          })

          ci.upload({
            project,
            version,
            desc
          })
            .then(() => {
              console.log('WeChat MiniProgram upload succeeded')
            })
            .catch((error) => {
              console.error('WeChat MiniProgram upload failed')
              console.error(error)
              process.exit(1)
            })
          EOF
