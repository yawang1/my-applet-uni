jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm install

      # 4. 编译 uni-app 为微信小程序
      - name: Build uni-app for MP-Weixin
        run: npm run build:mp-weixin

      # 5. 【关键修正】注入环境变量
      # 注意：前面不能有空格，必须与上面的 "- name:" 对齐
      - name: Setup Environment Variables
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PRIVATE_KEY_BASE64 }}
        run: |
          echo "WECHAT_APP_ID=$WECHAT_APP_ID" >> $GITHUB_ENV
          echo "WECHAT_PRIVATE_KEY_BASE64=$WECHAT_PRIVATE_KEY_BASE64" >> $GITHUB_ENV

      # 6. 执行预览脚本
      - name: Generate Preview QR Code
        run: node scripts/preview.js

      # 7. 上传二维码
      - name: Upload QR Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: preview-qrcode.jpg