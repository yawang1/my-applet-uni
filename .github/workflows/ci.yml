name: Build and Upload UniApp to WeChat MiniProgram

on:
  push:
    branches:
      - main  # 或者你的默认分支，比如 master

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # 根据你的项目调整 Node 版本

      - name: Install dependencies
        run: npm install

      - name: Build WeChat MiniProgram
        run: npm run build:mp-weixin

      # === 关键步骤：上传到微信小程序后台 ===
      - name: Upload to WeChat MiniProgram
        run: |
          # 1. 设置环境变量（注意：这里不要用 $ 包裹，直接赋值）
          echo "WECHAT_APP_ID=${{ secrets.WECHAT_APP_ID }}" >> $GITHUB_ENV
          
          # 如果你的密钥文件名包含特殊字符，建议直接在这里写死文件名，比如 private.key
          echo "WECHAT_PRIVATE_KEY_BASE64=${{ secrets.WECHAT_PRIVATE_KEY_BASE64 }}" >> $GITHUB_ENV

          # 2. 安装微信官方上传工具
          npm install miniprogram-ci --save-dev

          # 3. 执行上传脚本 (Node.js)
          node -e "
          const ci = require('miniprogram-ci');
          const fs = require('fs');
          
          // 读取 Base64 密钥并写入临时文件
          const privateKey = ;
          // 这里的 'private.key' 必须换成你下载的密钥文件的实际名字
          fs.writeFileSync('private.key', privateKey, 'base64');

          const project = new ci.Project({
            appid: wx528cb3a33a5fd6cf, 
            type: 'miniProgram',
            projectPath: 'unpackage/dist/build/mp-weixin', // uni-app 默认打包路径
            privateKeyPath: 'private.key', 
            ignores: ['node_modules/**/*']
          });

          // 生成带当前时间的备注
          const currentTime = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
          const desc = 'agent在 ' + currentTime + ' 提交上传';

          ci.upload({
            project,
            version: '1.0.0', 
            desc: desc 
          }).then(() => {
            console.log('✅ 微信小程序上传成功！');
          }).catch((err) => {
            console.error('❌ 上传失败:', err);
            process.exit(1);
          });
          "