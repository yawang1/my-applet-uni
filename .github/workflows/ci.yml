name: Build and Upload UniApp to WeChat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境 (锁定最稳定的 18 版本)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: 'npm'

      # 3. 彻底清理并安装依赖
      - name: Clean and Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm config set registry https://registry.npmmirror.com
          npm install --legacy-peer-deps

      # 4. 编译 uni-app 为微信小程序
      - name: Build uni-app for MP-Weixin
        run: npm run build:mp-weixin

      # 5. 上传到微信小程序后台
      - name: Upload to WeChat MiniProgram
        env:
          # 从 GitHub Secrets 读取配置
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PRIVATE_KEY_BASE64 }}
        run: |
		  # 0. 清理旧文件（防止损坏的缓存导致报错）
		  rm -rf node_modules package-lock.json
		  
		  # 0.5. 重新安装依赖
		  npm install
          # 1. 安装微信官方上传工具
          npm install miniprogram-ci --save-dev

          # 2. 将密钥内容写入临时文件
          # 微信工具必须读取文件，不能直接读环境变量内容
          echo "$WECHAT_PRIVATE_KEY_BASE64" > private.key

          # 3. 执行上传脚本
          node -e "
          const ci = require('miniprogram-ci');
          
          const project = new ci.Project({
            appid: process.env.WECHAT_APP_ID,
            type: 'miniProgram',
            projectPath: 'unpackage/dist/build/mp-weixin',
            privateKeyPath: 'private.key', // 指向刚才生成的文件
            ignores: ['node_modules/**/*']
          });

          // 生成当前时间作为备注
          const now = new Date();
          const timeStr = now.getFullYear() + '-' + 
                         String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                         String(now.getDate()).padStart(2, '0') + ' ' +
                         String(now.getHours()).padStart(2, '0') + ':' + 
                         String(now.getMinutes()).padStart(2, '0') + ':' + 
                         String(now.getSeconds()).padStart(2, '0');
          
          const desc = 'agent在 ' + timeStr + ' 提交上传';

          ci.upload({
            project,
            version: '1.0.0',
            desc: desc
          }).then(() => {
            console.log('✅ 微信小程序上传成功！');
          }).catch((err) => {
            console.error('❌ 上传失败:', err);
            process.exit(1);
          });
          "