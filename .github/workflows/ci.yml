name: Build and Upload WeChat MiniProgram

on:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build uni-app
        run: npm run build:mp-weixin

      - name: Upload to WeChat
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_PRIVATE_KEY_CONTENT: ${{ secrets.WECHAT_PRIVATE_KEY_CONTENT }}
        run: |
          npm install miniprogram-ci --save-dev

          cat << 'EOF' > upload.js
          const ci = require('miniprogram-ci');

          if (!process.env.WECHAT_PRIVATE_KEY_CONTENT) {
            throw new Error('❌ 未读取到 WECHAT_PRIVATE_KEY_CONTENT');
          }

          const project = new ci.Project({
            appid: process.env.WECHAT_APP_ID,
            type: 'miniProgram',
            projectPath: 'unpackage/dist/build/mp-weixin',
            privateKeyContent: process.env.WECHAT_PRIVATE_KEY_CONTENT,
            ignores: ['node_modules/**/*'],
          });

          const now = new Date().toLocaleString('zh-CN', {
            timeZone: 'Asia/Shanghai',
          });

          ci.upload({
            project,
            version: '1.0.0',
            desc: `agent在 ${now} 提交上传`,
          })
            .then(() => {
              console.log('✅ 上传成功');
            })
            .catch((err) => {
              console.error('❌ 上传失败', err);
              process.exit(1);
            });
          EOF

          node upload.js