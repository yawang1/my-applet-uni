name: Build UniApp and Generate Preview QR Code

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境 (锁定最稳定的 18 版本)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: 'npm'

      # 3. 【核心】彻底清理并强制安装依赖
      - name: Clean and Install dependencies
        run: |
          # 强制删除旧的依赖和缓存
          rm -rf node_modules package-lock.json
          npm cache clean --force
          
          # 使用国内淘宝镜像加速下载
          npm config set registry https://registry.npmmirror.com
          
          # 强制安装，忽略所有 peer deps 冲突
          npm install --legacy-peer-deps --force

      # 4. 编译 uni-app 为微信小程序
      - name: Build uni-app for MP-Weixin
        run: npm run build:mp-weixin

      # 5. 注入环境变量 (微信密钥)
      - name: Setup Environment Variables
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PRIVATE_KEY_BASE64 }}
        run: |
          echo "WECHAT_APP_ID=$WECHAT_APP_ID" >> $GITHUB_ENV
          echo "WECHAT_PRIVATE_KEY_BASE64=$WECHAT_PRIVATE_KEY_BASE64" >> $GITHUB_ENV
	- name: 上传到微信小程序后台
	        run: |
	          npm install miniprogram-ci --save-dev
	          node -e "
	          const ci = require('miniprogram-ci');
	          const project = new ci.Project({
	            appid: '你的小程序AppID', // 替换成你的
	            type: 'miniProgram',
	            projectPath: 'unpackage/dist/build/mp-weixin', // uni-app打包后的路径
	            privateKeyPath: '你的密钥文件名.key', // 刚才下载的那个key
	            ignores: ['node_modules/**/*']
	          });
	          ci.upload({
	            project,
	            version: '1.0.0', // 固定版本号
	            desc: 'agent在 $(date +"%Y-%m-%d %H:%M:%S") 提交上传' // 这里用Linux命令获取当前时间作为备注
	          }).then(() => {
	            console.log('✅ 上传成功！')
	          }).catch((err) => {
	            console.error(err);
	            process.exit(1);
	          });
	          "

      # 6. 执行预览脚本，生成二维码
      - name: Generate Preview QR Code
        run: node scripts/preview.js

      # 7. 上传生成的二维码
      - name: Upload QR Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: preview