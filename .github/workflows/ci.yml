name: Build UniApp and Generate Preview QR Code

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境（锁定 Node 24，兼容性最好）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. 【核心修复】强制清理并安装所有依赖（含缺失的 i18n 模块）
      - name: Clean and Install dependencies
        run: |
          # 彻底清除旧缓存（防止 Windows/Linux 依赖冲突）
          rm -rf node_modules package-lock.json
          npm cache clean --force
          
          # 强制安装 uni-app 核心依赖 + 显式安装 i18n 模块（关键！）
          npm install --legacy-peer-deps --force
          npm install --save-dev @dcloudio/uni-cli-i18n --legacy-peer-deps

      # 4. 编译 uni-app（用 npx 强制调用本地命令）
      - name: Build uni-app for MP-Weixin
        run: npx vue-cli-service uni-build --platform mp-weixin

      # 5. 注入环境变量（密钥）
      - name: Setup Environment Variables
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PRIVATE_KEY_BASE64 }}
        run: |
          echo "WECHAT_APP_ID=$WECHAT_APP_ID" >> $GITHUB_ENV
          echo "WECHAT_PRIVATE_KEY_BASE64=$WECHAT_PRIVATE_KEY_BASE64" >> $GITHUB_ENV

      # 6. 生成预览二维码
      - name: Generate Preview QR Code
        run: node scripts/preview.js

      # 7. 上传二维码
      - name: Upload QR Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: preview-qrcode.jpg