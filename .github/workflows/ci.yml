name: Build UniApp and Generate Preview QR Code

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. 【关键步骤】处理本地插件并强制安装
      # 这一步会把本地插件打包，然后修改 package.json 指向 tar 包，彻底解决 Linux 软链接 ENOENT 报错
      - name: Fix local plugin for Linux and Install deps
        run: |
          npm install -g npm-packlist
          
          # 打包本地插件
          cd src/uni_modules/eat-roulette-mini-program
          npm pack
          cd ../../..
          
          # 修改根目录 package.json，把本地插件替换为刚打的包
          sed -i 's|"eat-roulette-mini-program": "file:src/uni_modules/eat-roulette-mini-program"|"eat-roulette-mini-program": "file:src/uni_modules/eat-roulette-mini-program/eat-roulette-mini-program-1.0.0.tgz"|' package.json
          
          # 清理旧的 node_modules 防止缓存干扰
          rm -rf node_modules
          
          # 强制安装依赖（忽略 peer deps 冲突）
          npm install --legacy-peer-deps

      # 4. 编译 uni-app
      - name: Build uni-app for MP-Weixin
        run: |
          npm install
          npm run build:mp-weixin

      # 5. 注入环境变量
      - name: Setup Environment Variables
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PRIVATE_KEY_BASE64 }}
        run: |
          echo "WECHAT_APP_ID=$WECHAT_APP_ID" >> $GITHUB_ENV
          echo "WECHAT_PRIVATE_KEY_BASE64=$WECHAT_PRIVATE_KEY_BASE64" >> $GITHUB_ENV

      # 6. 执行预览脚本
      - name: Generate Preview QR Code
        run: node scripts/preview.js

      # 7. 上传二维码
      - name: Upload QR Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: preview-qrcode.jpg